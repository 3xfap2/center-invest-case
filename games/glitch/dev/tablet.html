<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Планшет: предпросмотр</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a2230;
        color: #ddd;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      /* Подобие 3D-сцены за планшетом */
      #view {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(#0d1322 0 45%, #1c2533 45% 100%);
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .dev-bar {
        position: fixed;
        left: 10px;
        top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        z-index: 5;
        font-size: 12px;
      }
      .dev-bar button {
        font: inherit;
        padding: 4px 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div class="dev-bar">
      <button data-dev="log">Журнал</button>
      <button data-dev="tracker">Трекер</button>
      <button data-dev="docs">Документация</button>
      <button data-dev="chat">Чат</button>
      <button data-dev="card">#0412</button>
      <button data-dev="terminal">Терминал</button>
      <button data-dev="msg">+сообщение</button>
      <button data-dev="foreign">+чужая запись</button>
    </div>
    <div id="ui"></div>
    <script type="module" src="./tablet.js"></script>
  </body>
</html>
